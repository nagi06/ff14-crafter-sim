<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルインド・アクアダクト中間素材 製作シミュレーター</title>
<style>
  :root{
    --bg:#15171e; --card:#1e222d; --line:#323848; --text:#e8eaf0; --sub:#9aa1b4;
    --accent:#6a8ff0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; gap:20px;}
  h1{font-size:1.05rem; text-align:center; line-height:1.6;}
  .sub{color:var(--sub); font-size:0.78rem; text-align:center; line-height:1.7;}
  .menu{display:flex; flex-direction:column; gap:14px; width:100%; max-width:420px;}
  a.card{display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:16px 18px; text-decoration:none; color:var(--text); transition:border-color .15s;}
  a.card:hover{border-color:var(--accent);}
  a.card .t{font-size:0.95rem; font-weight:bold; margin-bottom:6px;}
  a.card .d{font-size:0.75rem; color:var(--sub); line-height:1.7;}
  a.card.main{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .badge{display:inline-block; background:var(--accent); color:#fff; font-size:0.65rem;
         border-radius:6px; padding:2px 7px; margin-left:6px; vertical-align:middle;}
  footer{color:var(--sub); font-size:0.68rem; text-align:center; line-height:1.7;}
</style>
</head>
<body>
  <h1>ルインド・アクアダクト中間素材<br>製作シミュレーター</h1>
  <p class="sub">Lv100 ★5・品質31500の高難度レシピを、状態変化込みで練習・実機フォローするツール。<br>装備に合わせてバージョンを選んでください。</p>
  <div class="menu">
    <a class="card main" href="aqueduct/">
      <div class="t">進化版<span class="badge">NEW</span></div>
      <div class="d">スターズ実測ステ既定。全手打ち＋先読み期待値探索（v6）の推奨エンジンつき。実戦カンスト実績多数。</div>
    </a>
    <a class="card" href="macro-gen/">
      <div class="t">マクロメーカー</div>
      <div class="d">コスモミッションなど毎回数値が違うレシピ用。工数・品質・耐久とステータスを入れると2段マクロを自動生成。</div>
    </a>
  </div>
  <footer>ステータスは各シミュレーターの設定タブで変更できます。</footer>
</body>
</html>
